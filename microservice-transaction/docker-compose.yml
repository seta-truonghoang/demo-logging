version: '3.8'
services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9094,INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    environment:
      KAFKA_BROKERCONNECT: kafka:9093
    ports:
      - "9000:9000"
    depends_on:
      - kafka

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  monolithic-app:
    build:
      context: ./monlithic-transaction
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["monolithic"]

  saga-order:
    build:
      context: ./microservice-saga-choreography
      dockerfile: order-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      KAFKA_BROKER: "kafka:9093"
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
    profiles: ["saga-choreography"]

  saga-payment:
    build:
      context: ./microservice-saga-choreography
      dockerfile: payment-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      KAFKA_BROKER: "kafka:9093"
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    profiles: ["saga-choreography"]

  twopc-order:
    build:
      context: ./microservice-2pc
      dockerfile: order-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    profiles: ["2pc"]

  twopc-payment:
    build:
      context: ./microservice-2pc
      dockerfile: payment-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      PORT: "8084"
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    profiles: ["2pc"]

  twopc-coordinator:
    build:
      context: ./microservice-2pc
      dockerfile: coordinator/Dockerfile
    environment:
      ORDER_SERVICE_URL: "http://twopc-order:8083"
      PAYMENT_SERVICE_URL: "http://twopc-payment:8084"
      PORT: "8085"
    ports:
      - "8085:8085"
    depends_on:
      - twopc-order
      - twopc-payment
    profiles: ["2pc"]

  saga-orch-order:
    build:
      context: ./microservice-saga-orchestration
      dockerfile: order-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      PORT: "8086"
    ports:
      - "8086:8086"
    depends_on:
      - postgres
    profiles: ["saga-orchestration"]

  saga-orch-payment:
    build:
      context: ./microservice-saga-orchestration
      dockerfile: payment-service/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=demo password=demo dbname=demo port=5432 sslmode=disable TimeZone=UTC"
      PORT: "8087"
    ports:
      - "8087:8087"
    depends_on:
      - postgres
    profiles: ["saga-orchestration"]

  saga-orch-coordinator:
    build:
      context: ./microservice-saga-orchestration
      dockerfile: orchestrator/Dockerfile
    environment:
      ORDER_SERVICE_URL: "http://saga-orch-order:8086"
      PAYMENT_SERVICE_URL: "http://saga-orch-payment:8087"
      PORT: "8088"
    ports:
      - "8088:8088"
    depends_on:
      - saga-orch-order
      - saga-orch-payment
    profiles: ["saga-orchestration"]

volumes:
  pgdata:
